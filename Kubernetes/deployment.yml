apiVersion: apps/v1
kind: Deployment
metadata:
  name: nsflix-app
  labels:
    app: nsflix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nsflix-app
  template:
    metadata:
      labels:
        app: nsflix-app
    spec:
      containers:
      - name: nsflix-app
        image: niralhedau/nsflix:latest
        ports:
        - containerPort: 80
